[project]
name = "miiotpcApi"
version = "0.1.0"
description = "米家笔记本/PC 设备控制 API 与 CLI（mijiaAPI 的精简子集）"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "xiaomi",
    "mijia",
    "miot",
    "laptop",
    "notebook",
    "pc",
    "smart-home",
    "iot",
    "cli",
]
authors = [
    { name = "comor", email = "304593790@qq.com" },
]
maintainers = [
    { name = "comor", email = "304593790@qq.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "pycryptodome>=3.23.0",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "tzlocal>=5.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
miiotpcApi = "miiotpcApi.__main__:cli"

[project.urls]
Homepage = "https://github.com/comoror/miiotpcAPI"
Source = "https://github.com/comoror/miiotpcAPI"
Issues = "https://github.com/comoror/miiotpcAPI/issues"
Upstream = "https://github.com/Do1e/mijia-api"
"Original project" = "https://github.com/Do1e/mijia-api"
"MIoT Spec" = "https://home.miot-spec.com/"
"Xiaomi IoT" = "https://iot.mi.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miiotpcApi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
]
